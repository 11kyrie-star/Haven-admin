<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 160">
  <!-- 底层波浪：最浅，存在感最弱 -->
  <path fill="#589ff8" opacity="0.12" d="M0,108 C80,72 160,148 240,108 C320,68 400,148 480,108 C560,68 640,148 700,108 L700,160 L0,160 Z"/>
  <!-- 中层波浪：中蓝 -->
  <path fill="#589ff8" opacity="0.32" d="M0,122 C80,88 160,155 240,122 C320,89 400,155 480,122 C560,89 640,155 700,122 L700,160 L0,160 Z"/>
  <!-- 顶层波浪：主蓝色 -->
  <path fill="#589ff8" d="M0,138 C80,112 160,160 240,138 C320,116 400,160 480,138 C560,116 640,160 700,138 L700,160 L0,160 Z"/>
  <!-- 船锚 -->
  <g transform="translate(310, 22)" fill="none" stroke="#303F5B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- 锚环 -->
    <circle cx="40" cy="18" r="14"/>
    <!-- 锚杆 -->
    <line x1="40" y1="32" x2="40" y2="95"/>
    <!-- 横杆 -->
    <line x1="12" y1="65" x2="68" y2="65"/>
    <!-- 左锚爪 -->
    <path d="M12,65 Q-2,82 12,100"/>
    <!-- 右锚爪 -->
    <path d="M68,65 Q82,82 68,100"/>
  </g>
</svg>
